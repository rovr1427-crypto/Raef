/* ════════════════════════════════════════════════════════════════════

let lang = 'ar';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isEmpty = (v) => v == null || (Array.isArray(v) ? v.every(x => !String(x).trim()) : !String(v).trim());
const pad = (n) => String(n).padStart(2, '0');
const arrow = '<i class="fa-solid fa-arrow-right text-xs rtl:-scale-x-100"></i>';

// يعرض النص كفقرات أو القائمة كنقاط
function renderBlock(v) {
    if (Array.isArray(v)) {
        return `<ul class="space-y-3">${v.filter(x => String(x).trim()).map(x =>
            `<li class="flex gap-3"><span class="mt-2.5 w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span><span>${esc(x)}</span></li>`
        ).join('')}</ul>`;
    }
    return String(v).split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join('');
}

function renderCase(id) {
    const idx = PROJECTS.findIndex(p => p.id === id);
    const p = PROJECTS[idx], d = p[lang], t = UI[lang];
    const next = PROJECTS[(idx + 1) % PROJECTS.length];

    // الأقسام تظهر فقط إذا فيها محتوى، والترقيم يتعدل تلقائياً
    const sections = [
        ['overview', d.overview], ['problem', d.problem], ['goal', d.goal],
        ['research', d.research],
    ].filter(([, v]) => !isEmpty(v));

    const hasSolution = !isEmpty(d.solution) || (p.images && p.images.length) || p.protoLink;
    let n = 0;
    const head = (key) => `
        <div class="flex items-baseline gap-3 mb-4">
            <span class="section-num">${pad(++n)}</span>
            <h2 class="text-xl sm:text-2xl font-bold text-ink">${esc(t['cs-' + key])}</h2>
        </div>`;
    const sec = (key, v) => `<section class="py-9 border-t border-line">${head(key)}<div class="text-[15px] text-muted leading-loose space-y-4">${renderBlock(v)}</div></section>`;

    const images = (p.images || []).map(im => {
        const src = typeof im === 'string' ? im : im.src;
        const cap = typeof im === 'string' ? '' : (im[lang] || '');
        return `<figure class="space-y-2">
            <img src="${esc(src)}" alt="${esc(cap || d.title)}" loading="lazy" class="w-full rounded-2xl border border-line bg-soft">
            ${cap ? `<figcaption class="text-xs text-muted text-center">${esc(cap)}</figcaption>` : ''}
        </figure>`;
    }).join('');

    const meta = [
        [t['cs-year'], esc(p.year)],
        [t['cs-tools'], `<span dir="ltr">${p.tags.map(esc).join(' · ')}</span>`],
        d.role ? [t['cs-role'], esc(d.role)] : null,
    ].filter(Boolean);

    $('case-root').innerHTML = `
        <a href="#projects" class="inline-flex items-center gap-2 text-sm font-medium text-muted hover:text-ink transition-colors">
            <i class="fa-solid fa-arrow-left text-xs rtl:-scale-x-100"></i>
            <span>${esc(t['cs-back'])}</span>
        </a>

        <header class="mt-10 pb-10">
            <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-md bg-accent-soft text-accent">${esc(t.case)}</span>
            <h1 class="mt-4 text-3xl sm:text-5xl font-bold tracking-tight text-ink leading-tight">${esc(d.title)}</h1>
            <p class="mt-4 text-base sm:text-lg text-muted leading-relaxed">${esc(d.subtitle || d.desc)}</p>
            <dl class="mt-8 grid grid-cols-2 sm:grid-cols-3 gap-4">

            </dl>
            ${p.cover ? `<img src="${esc(p.cover)}" alt="${esc(d.title)}" class="mt-8 w-full rounded-2xl border border-line">` : ''}
        </header>

        ${sections.map(([k, v]) => sec(k, v)).join('')}

        ${hasSolution ? `
        <section class="py-9 border-t border-line">
            ${head('solution')}
            ${!isEmpty(d.solution) ? `<div class="text-[15px] text-muted leading-loose space-y-4 mb-6">${renderBlock(d.solution)}</div>` : ''}
            ${images ? `<div class="grid gap-6">${images}</div>` : ''}
            ${p.protoLink ? `
            <a href="${esc(p.protoLink)}" target="_blank" rel="noopener" class="mt-6 w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-accent hover:bg-blue-700 text-white text-sm font-medium transition-all shadow-sm">
                <i class="fa-brands fa-figma"></i><span>${esc(t['cs-proto'])}</span>
            </a>` : ''}
        </section>` : ''}

        ${!isEmpty(d.takeaways) ? sec('takeaways', d.takeaways) : ''}

        ${next && next.id !== p.id ? `
        <a href="#/project/${esc(next.id)}" class="group mt-6 flex items-center justify-between gap-4 p-6 rounded-2xl bg-slate-900 text-white hover:bg-slate-800 transition-colors">
            <div>
                <span class="text-xs text-slate-400">${esc(t['cs-next'])}</span>
                <p class="mt-1 text-lg font-bold">${esc(next[lang].title)}</p>
            </div>
            <span class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-slate-900 transition-all">${arrow}</span>
        </a>` : ''}
    `;
}

// التنقل بين الصفحة الرئيسية ودراسات الحالة (يدعم زر الرجوع في المتصفح)
function route() {
    const m = location.hash.match(/^#\/project\/(.+)$/);
    const project = m && PROJECTS.find(p => p.id === decodeURIComponent(m[1]));
    if (project) {
        renderCase(project.id);
        $('home-view').classList.add('hidden');
        $('case-study-view').classList.remove('hidden');
        window.scrollTo({ top: 0 });
    } else {
        const wasCase = !$('case-study-view').classList.contains('hidden');
        $('home-view').classList.remove('hidden');
        $('case-study-view').classList.add('hidden');
        const target = location.hash.length > 1 && document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView({ behavior: wasCase ? 'auto' : 'smooth' });
        else if (wasCase) window.scrollTo({ top: 0 });
    }
}

function renderAll() {
    renderStatic();
    renderProjects();
    renderExperience();
    renderAbout();
    renderResume();
}

function toggleLanguage() {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    renderAll();
    const m = location.hash.match(/^#\/project\/(.+)$/);
    if (m && PROJECTS.find(p => p.id === m[1])) renderCase(m[1]);
}

function showNotification(msg) {
    const toast = $('toast');
    $('toast-msg').textContent = msg;
    toast.classList.remove('opacity-0');
    setTimeout(() => toast.classList.add('opacity-0'), 3000);
}

window.addEventListener('hashchange', route);
renderAll();
route();
